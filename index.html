<div class="card">
  <h1 class="japanese">こんにちは</h1>
  <p class="english">Hello</p>
</div>
<style>
  /* Styling the Card Background */
  .card {
    background-color: white;    /* Gives the card a white background */
    width: 250px;               /* Sets how wide the card is */
    height: 150px;              /* Sets how tall the card is */
    border-radius: 15px;        /* Makes the corners rounded like a real card */
    border: 2px solid #333;     /* Adds a dark border around the edges */
    text-align: center;         /* Centers all the words inside the card */
    padding: 20px;              /* Gives space inside so text doesn't touch the edge */
  }

  /* Styling the Words Inside */
  .japanese {
    font-size: 32px;            /* Makes the Japanese word large */
    color: #333;                /* Dark gray text color */
  }

  .english {
    font-size: 18px;            /* Makes the English word smaller */
    color: #666;                /* Lighter text color */
  }
</style>
